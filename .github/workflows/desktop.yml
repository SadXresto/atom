name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: atom-linux-x86_64
          - os: windows-latest
            bundles: nsis,msi
            artifact: atom-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target

      - name: Build interface
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build and bundle desktop app
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/target/release/bundle/**
          if-no-files-found: error

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/target/release/bundle/deb/*.deb
            apps/desktop/target/release/bundle/appimage/*.AppImage
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
