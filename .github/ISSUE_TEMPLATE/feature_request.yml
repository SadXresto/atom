name: Feature request
description: Suggest an idea or improvement for ATOM.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you want solved, not just the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that ATOM does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require sending user data over the network.
        - label: This fits ATOM's local-first philosophy.