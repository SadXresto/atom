[package]
name = "atom-api"
version.workspace = true
edition.workspace = true

[features]
# Compile the built UI into the binary. The desktop app enables this so a
# shipped .exe/.deb contains the interface and never needs frontend/dist on the
# user's disk.
default = []
embed-ui = ["dep:include_dir"]

[lib]
name = "atom_api"
path = "src/lib.rs"

[[bin]]
name = "atom-api"
path = "src/main.rs"

[dependencies]
atom-bench = { path = "../../crates/atom-bench" }
atom-compression = { path = "../../crates/atom-compression" }
atom-core = { path = "../../crates/atom-core" }
atom-engine = { path = "../../crates/atom-engine" }
atom-micro = { path = "../../crates/atom-micro" }
atom-inference = { path = "../../crates/atom-inference" }
atom-memory = { path = "../../crates/atom-memory" }
atom-models = { path = "../../crates/atom-models" }
atom-security = { path = "../../crates/atom-security" }
axum.workspace = true
chrono.workspace = true
include_dir = { version = "0.7", optional = true }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
