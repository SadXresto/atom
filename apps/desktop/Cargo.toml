[package]
name = "atom-desktop"
version = "0.2.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atom-api = { path = "../api", features = ["embed-ui"] }
atom-core = { path = "../../crates/atom-core" }
atom-engine = { path = "../../crates/atom-engine" }
axum = "0.8"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
